    <path d="M1.262 13.326A1 1 0 0 0 2 15h16a1 1 0 0 0 .74-1.673C17.41 11.956 16 10.499 16 6A6 6 0 0 0 4 6c0 4.499-1.411 5.956-2.738 7.326" stroke="url(#alertaz_icon)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
